# Runs the site in nginx on http://localhost:8086 (set PORT in a .env file to change it).
#   docker compose up -d --build   build from this checkout and start
services:
  kuehl-family:
    image: kuehl-family:local
    build: .
    container_name: kuehl-family
    restart: unless-stopped
    ports:
      - "${PORT:-8086}:80"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
